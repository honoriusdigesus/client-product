<div class="bg-blue-900 min-h-screen z-10 text-slate-300 w-64 left-0 h-screen overflow-y-scroll flex flex-col">
  <div class="my-4 px-6" id="logo">
    <h1 class="text-lg md:text-2xl font-bold text-white">Dash<span class="text-blue-500">8</span>.</h1>
    <p class="text-slate-500 text-sm">Manage your actions and activities</p>
  </div>
  <div class="px-6 py-10" id="profile">
    <p class="text-slate-500">Bienvenido de nuevo,,</p>
    <a class="inline-flex space-x-2 items-center" href="#">
      <span>
        <img alt="" class="rounded-full w-8 h-8"
             src="https://image.lexica.art/full_webp/3c0c18ae-5b81-4fcf-b5c8-4f2826204821">
      </span>
      <span class="text-sm md:text-base font-bold">
        {{user()?.fullName}}
      </span>
    </a>
  </div>
  <div class="w-full px-6 flex-grow" id="nav">
    <!-- Products Menu -->
    <a class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150"
       href="#">
      <div>
        <span class="material-symbols-outlined">grocery</span>
      </div>
      <div class="flex flex-col">
        <span class="text-lg text-slate-300 font-bold leading-5">Products</span>
        <span class="text-sm text-slate-500 hidden md:block">Manage Products</span>
      </div>
    </a>
    <!-- Users Menu -->
    <a class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150"
       href="#">
      <div>
        <span class="material-symbols-outlined">group</span>
      </div>
      <div class="flex flex-col">
        <span class="text-lg text-slate-300 font-bold leading-5">Users</span>
        <span class="text-sm text-slate-500 hidden md:block">Manage Users</span>
      </div>
    </a>
    <!-- Roles Menu -->
    <a class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150"
       href="#">
      <div>
        <span class="material-symbols-outlined">shield_person</span>
      </div>
      <div class="flex flex-col">
        <span class="text-lg text-slate-300 font-bold leading-5">Roles</span>
        <span class="text-sm text-slate-500 hidden md:block">Manage Roles</span>
      </div>
    </a>
  </div>
  <!-- Logout Button at the bottom -->
  <a class="w-full px-2 inline-flex space-x-2 items-center border-t border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150"
     href="#">
    <div>
      <span class="material-symbols-outlined">logout</span>
    </div>
    <div class="flex flex-col">
      <span class="text-lg text-slate-300 font-bold leading-5">Logout</span>
      <span class="text-sm text-slate-500 hidden md:block">Sign out of your account</span>
    </div>
  </a>
</div>
